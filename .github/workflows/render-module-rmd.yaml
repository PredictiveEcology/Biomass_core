## Thin caller. The job itself lives in PredictiveEcology/actions, so the pins for
## install-spatial-deps, install-Require, install-SpaDES and install-Rmd-pkgs live
## there and move once, instead of being frozen into this repository on the day the
## file was generated. This repo had all four pinned at @v0.2.
##
## install-spatial-deps@v0.2 adds the ubuntugis PPA, whose GDAL is ABI-incompatible
## with the binaries in Posit's noble cache; the shared action stopped adding it some
## time ago. That is the pin this replaces, and the reason repointing it in place
## would only have been a stopgap.
##
## No `extra-apt` is needed: the six packages the old file installed by hand
## (libcurl4-openssl-dev, libgit2-dev, libglpk-dev, libmagick++-dev, libxml2-dev,
## python3-gdal) are exactly the called workflow's default set, and it wraps them in
## apt retries and timeouts that a bare `sudo apt-get install` did not have.
##
## Matches the already-migrated sibling Biomass_borealDataPrep.
## https://github.com/PredictiveEcology/actions/blob/main/.github/workflows/render-module-rmd.yaml

name: Render module Rmd

on:
  pull_request:
    branches:
      - main
      - development
  push:
    branches:
      - main
      - development
    paths:
      - .github/workflows/render-module-rmd.yaml
      - Biomass_core.Rmd
      - Biomass_core.R
  workflow_dispatch:

jobs:
  render-module-rmd:
    ## The called workflow splits `render` (contents: read, which installs and then
    ## executes this module's own code) from `commit` (contents: write, which runs
    ## nothing but git). A called workflow can only reduce what is granted here,
    ## never widen it, so the write scope has to be granted at the call site.
    permissions:
      contents: write
    uses: PredictiveEcology/actions/.github/workflows/render-module-rmd.yaml@main
    with:
      module: Biomass_core
